<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a8a49b">
  <title>{% block title %}Semáforo documental{% endblock %} · llm-lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ asset('app.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script src="{{ asset('app.js') }}" defer></script>
</head>
<body>
  {% set here = request.url.path %}
  <header class="site-header">
    <a class="brand" href="/"><span class="lights"><i></i><i></i><i></i></span>Semáforo documental</a>
    <nav>
      <a href="/" class="{{ 'active' if here == '/' }}">Inicio</a>
      <a href="/documentos" class="{{ 'active' if here.startswith('/documentos') or here.startswith('/documents') }}">Documentos</a>
      <a href="/chat" class="{{ 'active' if here.startswith('/chat') }}">Chat</a>
      <a href="/rules" class="{{ 'active' if here.startswith('/rules') }}">Reglas</a>
      <a href="/estudio" class="{{ 'active' if here.startswith('/estudio') }}">Estudio</a>
    </nav>
  </header>
  <main class="{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <span class="label">llm-lab · laboratorio de LLMs y RAG · costo cero</span>
    <a class="label" href="https://github.com/BalbianoLuciano/llm-lab" target="_blank" rel="noopener">Código ↗</a>
  </footer>
  <div id="toast-slot"></div>
</body>
</html>
