[project]
name = "llm-lab"
version = "0.1.0"
description = "Laboratorio de LLMs y RAG: experimentos chicos, medidos y reproducibles"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "docling>=2.138.0",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "mlx-lm>=0.32.0",
    "mlx-whisper>=0.4.3",
    "open-alternative-jev",
    "openai>=3.29.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_lab"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
open-alternative-jev = { git = "https://github.com/ikermoel/open-alternative-jev", rev = "3689c67aed7e710cd44f23d41706139f29aae57e" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
