[project]
name = "llm-lab"
version = "0.1.0"
description = "Laboratorio de LLMs y RAG: experimentos chicos, medidos y reproducibles"
requires-python = ">=3.12"
dependencies = [
    "mlx-whisper>=0.4.3",
    "openai>=3.29.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_lab"]

[tool.ruff]
line-length = 100
